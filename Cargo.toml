[package]
name = "gc-ims-tools-rs"
version = "0.1.0"
edition = "2021"
description = "Rust numerical kernel for gc-ims-tools (chemometrics for GC-IMS data)"
license = "BSD-3-Clause"
authors = ["Philipp Weller <philippweller@users.noreply.github.com>"]

[lib]
name = "gc_ims_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
csv = "1.3"
clap = { version = "4", features = ["derive"] }

# Python bindings (PyO3). Optional so the standalone `gcims` CLI builds
# without Python; maturin activates the `python` feature.
pyo3 = { version = "0.22", features = ["abi3-py39"], optional = true }
numpy = { version = "0.22", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "gcims"
path = "src/main.rs"
