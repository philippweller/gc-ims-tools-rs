[package]
name = "gc-ims-tools-rs"
version = "0.1.0"
edition = "2021"
description = "Rust numerical kernel for gc-ims-tools (chemometrics for GC-IMS data)"
license = "BSD-3-Clause"
authors = ["Philipp Weller <philippweller@users.noreply.github.com>"]

[lib]
name = "gc_ims_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
ndarray = "0.16"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
